<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Social Assistant</title>
<style>
:root{--bg:#0a1020;--card:#111a2e;--line:#22314f;--tx:#eaf0fb;--mut:#8fa1c2;--ac:#ff7a1a;--bl:#3d8bff;--ok:#2fbf71;--bad:#ef5350;--warn:#e6b422}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(900px 320px at 50% -120px,#1d4fb066,transparent),var(--bg);min-height:100vh}
main{padding:0 14px 96px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:11px;padding:16px 2px 4px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--bl),var(--ac));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.top b{font-size:18px;letter-spacing:.2px;display:block;line-height:1.2}
.top span{font-size:12px;color:var(--mut)}
h1{font-size:22px;margin:16px 0 6px}
h2{font-size:12px;margin:22px 0 8px;color:var(--bl);font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px #0004}
.note{background:#3d8bff14;border:1px solid #3d8bff40;border-left:3px solid var(--bl);color:#bcd3ff;border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:#0b1426;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--bl);box-shadow:0 0 0 3px #3d8bff33}
textarea{min-height:96px;resize:vertical}
button{background:var(--ac);color:#1a0f00;border:0;border-radius:11px;padding:11px 15px;font-weight:700}
button.blue{background:var(--bl);color:#04122b}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600}
button.sm{padding:6px 11px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}.row>.fit{flex:0 0 auto}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.chip.published,.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.failed{color:var(--bad);border-color:var(--bad)}
.chip.manual{color:var(--ac);border-color:var(--ac)}
.chip.processing,.chip.queued{color:var(--bl);border-color:var(--bl)}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px;word-break:break-word}
.acct{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.acct:last-child{border:0}.acct input{width:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c1426ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:13px 2px;font-size:12px;font-weight:600;border-top:2px solid transparent}
nav button.on{color:var(--bl);border-top-color:var(--bl)}
progress{width:100%;height:10px;accent-color:var(--bl)}
.tag{display:inline-block;margin:2px 4px 2px 0;font-size:13px}
.msg{padding:10px;border-radius:10px;background:#12301f;border:1px solid var(--ok);margin:10px 0;font-size:14px}
.msg.bad{background:#2d1a1d;border-color:var(--bad)}
.hidden{display:none}
</style>
</head>
<body>
<main><div class="top"><div class="logo">S</div><div><b>Social Assistant</b><span>Post once, share everywhere</span></div></div><div id="app"></div></main>
<nav id="nav" class="hidden">
  <button data-t="post">Post</button>
  <button data-t="queue">Queue</button>
  <button data-t="tags">Hashtags</button>
  <button data-t="insights">Insights</button>
  <button data-t="accounts">Accounts</button>
</nav>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get: k => { try { return localStorage.getItem(k) || '' } catch { return '' } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
const cfg = { url: store.get('op_url'), pass: store.get('op_pass') };
const state = { tab: 'post', accounts: [], msg: null };
const PLAT = { facebook: 'Facebook Page', instagram: 'Instagram', youtube: 'YouTube', tiktok: 'TikTok' };
const AUTO = ['facebook', 'instagram'];
const OPEN_APP = { tiktok: 'https://www.tiktok.com/upload', youtube: 'https://studio.youtube.com' };

async function api(action, payload = {}) {
  const r = await fetch(cfg.url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-passcode': cfg.pass }, body: JSON.stringify({ action, ...payload }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j.data;
}
const flash = (text, bad) => { state.msg = { text, bad }; };
const msgHtml = () => state.msg ? `<div class="msg ${state.msg.bad ? 'bad' : ''}">${esc(state.msg.text)}</div>` : '';
const fmt = d => new Date(d).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function localInput(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ---------- setup ---------- */
function setup() {
  $('#nav').classList.add('hidden');
  $('#app').innerHTML = `<h1>Connect</h1>${msgHtml()}<div class="note">Enter your API address and passcode one time. They stay on this phone.</div>
  <div class="card"><label>API URL (your Supabase function)</label><input id="u" placeholder="https://xxxx.supabase.co/functions/v1/api" value="${esc(cfg.url)}">
  <label>Passcode</label><input id="p" type="password" value="${esc(cfg.pass)}">
  <p class="row"><button id="go">Connect</button></p></div>`;
  $('#go').onclick = async () => {
    cfg.url = $('#u').value.trim(); cfg.pass = $('#p').value;
    try { await api('ping'); store.set('op_url', cfg.url); store.set('op_pass', cfg.pass); state.msg = null; boot(); }
    catch (e) { flash('Could not connect: ' + e.message, true); setup(); }
  };
}

/* ---------- tabs ---------- */
async function show(tab) {
  state.tab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#app').innerHTML = '<p class="mut">Loading…</p>';
  try { await ({ post: viewPost, queue: viewQueue, tags: viewTags, insights: viewInsights, accounts: viewAccounts })[tab](); }
  catch (e) { $('#app').innerHTML = `<h1>Something went wrong</h1><p class="err">${esc(e.message)}</p><p><button id="rt">Try again</button> <button class="ghost" id="rs">Change connection</button></p>`; $('#rt').onclick = () => show(tab); $('#rs').onclick = setup; }
}

async function viewPost() {
  state.accounts = (await api('list_accounts')).filter(a => a.active);
  const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0);
  const accts = state.accounts.length ? state.accounts.map(a => `<label class="acct" style="margin:0;color:var(--tx);font-size:15px"><input type="checkbox" class="ac" value="${a.id}"><span>${esc(a.label)} <span class="mut">${PLAT[a.platform]}${AUTO.includes(a.platform) ? (a.has_credentials ? '' : ' · needs token') : ' · manual for now'}</span></span></label>`).join('')
    : '<p class="mut">No accounts yet.</p><p><button class="blue sm" id="goacc">Add accounts</button></p>';
  $('#app').innerHTML = `<h1>New post</h1>${msgHtml()}<div class="note">Write the caption once. Up to 5 hashtags are added for you.</div>
  <div class="card"><label>Video (max 50 MB)</label><input id="f" type="file" accept="video/*">
  <label>Title (for you only)</label><input id="ti" placeholder="e.g. Trailer – Episode 3">
  <label>Caption</label><textarea id="ca" placeholder="Write once, used for every platform"></textarea>
  <div class="row" style="margin-top:8px"><label class="fit" style="margin:0;color:var(--tx)"><input type="checkbox" id="at" checked style="width:auto"> Auto hashtags</label><input id="tn" type="number" min="0" max="5" value="5" style="max-width:80px"><span class="mut fit">tags</span></div>
  <p class="mut" style="margin:6px 0 0"><span id="pv"></span> <button class="ghost sm" id="pb">Preview hashtags</button></p></div>
  <h2>Post to</h2><div class="card">${accts}</div>
  <h2>When</h2><div class="card"><label>First post time</label><input id="dt" type="datetime-local" value="${localInput(d)}">
  <label>Minutes between accounts (staggering looks more natural)</label><input id="sg" type="number" min="0" max="240" value="10"></div>
  <p><button id="go" style="width:100%">Schedule</button></p><progress id="pg" class="hidden" max="100" value="0"></progress><p class="mut" id="st"></p>`;
  state.msg = null;
  $('#tn').oninput = () => { if (+$('#tn').value > 5) $('#tn').value = 5; if (+$('#tn').value < 0) $('#tn').value = 0; };
  $('#pb').onclick = async () => { try { const r = await api('hashtag_suggest', { n: Math.min(5, +$('#tn').value || 5) }); $('#pv').textContent = r.tags.map(t => '#' + t).join(' '); } catch (e) { $('#pv').textContent = e.message; } };
  $('#go').onclick = submitPost;
  if ($('#goacc')) $('#goacc').onclick = () => show('accounts');
}

function uploadWithProgress(url, file) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('PUT', url);
    x.upload.onprogress = e => { if (e.lengthComputable) $('#pg').value = Math.round(e.loaded / e.total * 100); };
    x.onload = () => x.status < 300 ? res() : rej(new Error('Upload failed (' + x.status + '): ' + x.responseText.slice(0, 160)));
    x.onerror = () => rej(new Error('Upload failed: network error'));
    const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', file);
    x.send(fd);
  });
}

async function submitPost() {
  const f = $('#f').files[0], ids = [...document.querySelectorAll('.ac:checked')].map(c => c.value), cap = $('#ca').value.trim();
  const st = t => $('#st').textContent = t;
  if (!f) return st('Choose a video first.');
  if (f.size > 50 * 1024 * 1024) return st('That video is over 50 MB (the free storage limit). Compress it first.');
  if (!ids.length) return st('Pick at least one account.');
  if (!cap) return st('Write a caption.');
  const base = new Date($('#dt').value), gap = Math.max(0, +$('#sg').value || 0);
  if (isNaN(base)) return st('Pick a date and time.');
  $('#go').disabled = true; $('#pg').classList.remove('hidden');
  try {
    st('Uploading video…');
    const up = await api('upload_url', { filename: f.name });
    await uploadWithProgress(up.upload_url, f);
    st('Scheduling…');
    const targets = ids.map((id, i) => ({ account_id: id, caption: cap, scheduled_at: new Date(base.getTime() + i * gap * 60000).toISOString() }));
    const r = await api('create_post', { title: $('#ti').value.trim(), video_path: up.path, targets, auto_tags: $('#at').checked, tag_count: Math.min(5, Math.max(0, +$('#tn').value || 0)) });
    flash(`Scheduled ${r.targets} post(s).`); show('queue');
  } catch (e) { st('Error: ' + e.message); $('#go').disabled = false; }
}

async function viewQueue() {
  const rows = await api('queue');
  const open = rows.filter(r => ['queued', 'processing', 'manual', 'failed'].includes(r.status)).sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  const past = rows.filter(r => ['published', 'done'].includes(r.status));
  const card = r => `<div class="card" data-id="${r.id}">
    <div class="row"><b>${esc(r.accounts?.label || r.platform)}</b><span class="fit chip ${r.status}">${r.status === 'manual' ? 'post it now' : r.status}</span></div>
    <div class="mut">${esc(r.posts?.title || '')} · ${fmt(r.scheduled_at)}</div>
    <div class="mut" style="white-space:pre-wrap;margin:6px 0">${esc(r.caption).slice(0, 260)}</div>
    ${r.error ? `<div class="err">${esc(r.error)}</div>` : ''}
    <div class="row">
    ${r.status === 'manual' ? `<button class="sm cp">Copy caption</button>${r.posts?.video_url ? `<a class="fit" href="${esc(r.posts.video_url)}" target="_blank" download><button class="sm ghost">Video</button></a>` : ''}${OPEN_APP[r.platform] ? `<a class="fit" href="${OPEN_APP[r.platform]}" target="_blank"><button class="sm ghost">Open app</button></a>` : ''}<button class="sm dn">Done</button>` : ''}
    ${r.status === 'failed' ? '<button class="sm rt">Retry</button>' : ''}
    <button class="sm ghost dl fit">Delete</button></div>
    ${['published', 'done'].includes(r.status) ? `<div class="row" style="margin-top:8px"><input class="v" type="number" placeholder="views" value="${r.views || ''}"><input class="l" type="number" placeholder="likes" value="${r.likes || ''}"><input class="c" type="number" placeholder="comments" value="${r.comments || ''}"><button class="sm sv fit">Save</button></div>` : ''}
  </div>`;
  $('#app').innerHTML = `<h1>Queue</h1>${msgHtml()}<div class="note">Orange “post it now” means you post that one yourself. Copy the caption, post it, then tap Done.</div><h2>Upcoming & needs action</h2>${open.map(card).join('') || '<p class="mut">Nothing waiting.</p>'}<h2>Published</h2>${past.map(card).join('') || '<p class="mut">Nothing yet.</p>'}`;
  state.msg = null;
  const by = new Map(rows.map(r => [r.id, r]));
  document.querySelectorAll('.card[data-id]').forEach(el => {
    const id = el.dataset.id, r = by.get(id), run = async (fn) => { try { await fn(); show('queue'); } catch (e) { alert(e.message); } };
    const on = (s, fn) => { const b = $(s, el); if (b) b.onclick = fn; };
    on('.cp', () => navigator.clipboard.writeText(r.caption).then(() => alert('Caption copied')));
    on('.dn', () => run(() => api('mark_done', { id })));
    on('.rt', () => run(() => api('retry_target', { id })));
    on('.dl', () => confirm('Delete the whole video post (all its accounts)?') && run(() => api('delete_post', { id: r.post_id })));
    on('.sv', () => run(() => api('log_stats', { id, views: $('.v', el).value, likes: $('.l', el).value, comments: $('.c', el).value })));
  });
}

async function viewTags() {
  const rows = await api('hashtags');
  $('#app').innerHTML = `<h1>Hashtags</h1>${msgHtml()}<div class="note">Ranked by how they perform for you. Log views in the Queue to teach it. Starter tags are only a guess.</div>
  <div class="card"><label>Add tags (paste a trending list, any format)</label><textarea id="nt" placeholder="#kenyanmovies #nairobi …"></textarea><p><button id="ad" class="sm">Add</button></p></div>
  ${rows.map(h => `<div class="card row" data-t="${esc(h.tag)}"><div><b>#${esc(h.tag)}</b> <span class="chip">${esc(h.source)}</span><div class="mut">${h.uses} uses · ${h.avg_views ?? '–'} avg views · score ${h.score}</div></div><button class="sm ghost fit tg">${h.active ? 'On' : 'Off'}</button></div>`).join('')}`;
  state.msg = null;
  $('#ad').onclick = async () => { try { await api('hashtag_add', { tags: $('#nt').value, source: 'trending' }); show('tags'); } catch (e) { alert(e.message); } };
  document.querySelectorAll('.tg').forEach(b => b.onclick = async () => { const t = b.closest('.card').dataset.t, on = b.textContent !== 'On'; await api('hashtag_toggle', { tag: t, active: on }); show('tags'); });
}

async function viewInsights() {
  const i = await api('insights');
  $('#app').innerHTML = `<h1>Insights</h1><div class="note">Save your views in the Queue. The more you save, the better the advice.</div><div class="card"><b>What to do</b>${i.tips.map(t => `<p style="margin:8px 0">${esc(t)}</p>`).join('') || '<p class="mut">No data yet.</p>'}</div>
  <h2>Best hours (Nairobi)</h2>${i.bestHours.map(h => `<div class="card">${String(h.hour).padStart(2, '0')}:00 · ${h.avgViews} avg views · ${h.posts} posts</div>`).join('') || '<p class="mut">Needs 2+ posts per hour.</p>'}
  <h2>Profiles</h2>${i.accounts.map(a => `<div class="card">${esc(a.key)} · ${a.avgViews} avg views · ${a.posts} posts</div>`).join('') || '<p class="mut">No data yet.</p>'}
  <h2>Proven hashtags</h2><div class="card">${i.topTags.map(t => `<span class="tag">#${esc(t.tag)} <span class="mut">${t.avgViews}</span></span>`).join('') || '<span class="mut">Needs 3+ uses per tag.</span>'}</div>`;
}

async function viewAccounts() {
  const rows = await api('list_accounts');
  $('#app').innerHTML = `<h1>Accounts</h1>${msgHtml()}<div class="note">Add each account you post to. Facebook works for <b>Pages</b> only, not personal profiles. Instagram must be Business or Creator, linked to your Page.</div>
  ${rows.filter(a => a.active).map(a => `<div class="card row"><div><b>${esc(a.label)}</b><div class="mut">${PLAT[a.platform]} · ${a.has_credentials ? 'connected' : AUTO.includes(a.platform) ? 'needs token' : 'no token needed yet'}</div></div><button class="sm ghost fit rm" data-id="${a.id}">Remove</button></div>`).join('') || '<p class="mut">None yet.</p>'}
  <h2>Add account</h2><div class="card"><label>Platform</label><select id="pl">${Object.entries(PLAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
  <label>Name (e.g. TBOL Movies, TikTok #2)</label><input id="lb">
  <div id="cr"></div><p><button id="sa">Save</button></p></div>`;
  state.msg = null;
  const draw = () => { const p = $('#pl').value; $('#cr').innerHTML = p === 'facebook' ? '<label>Page ID</label><input id="c1"><label>Page access token</label><input id="c2" type="password"><p class="mut">You can leave these empty now and add them later.</p>' : p === 'instagram' ? '<label>Instagram user ID</label><input id="c1"><label>Access token</label><input id="c2" type="password"><p class="mut">You can leave these empty now and add them later.</p>' : '<p class="mut">No login needed yet. This account will show up as “post it now” reminders until automatic posting is built.</p>'; };
  $('#pl').onchange = draw; draw();
  $('#sa').onclick = async () => {
    const p = $('#pl').value, credentials = p === 'facebook' ? { page_id: $('#c1').value.trim(), access_token: $('#c2').value.trim() } : p === 'instagram' ? { ig_user_id: $('#c1').value.trim(), access_token: $('#c2').value.trim() } : {};
    Object.keys(credentials).forEach(k => { if (!credentials[k]) delete credentials[k]; });
    try { await api('save_account', { platform: p, label: $('#lb').value.trim(), credentials }); show('accounts'); } catch (e) { alert(e.message); }
  };
  document.querySelectorAll('.rm').forEach(b => b.onclick = async () => { if (confirm('Remove this account? Old history is kept.')) { await api('delete_account', { id: b.dataset.id }); show('accounts'); } });
}

function boot() {
  if (!cfg.url || !cfg.pass) return setup();
  $('#nav').classList.remove('hidden');
  show(state.tab);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
